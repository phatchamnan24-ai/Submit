<!DOCTYPE html>
<html lang="km">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ចុះឈ្មោះចូលរៀន ឆ្នាំសិក្សា ថ្មី - NTTI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --font-khmer: 'KD Jayavarman I', 'KD Jayavarman I', 'KD Jayavarman I', sans-serif;
      --font-english: 'KD Jayavarman I', 'Roboto', 'Segoe UI', Arial, sans-serif;
      --teal-dark: #063940;
      --teal-mid: #0b5c61;
      --teal-bright: #0d7a69;
      --accent-green: #109b68;
      --bg-page: #eef4f5;
      --border: #d8e2e6;
      --text-main: #0f172a;
      --text-muted: #64748b;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: var(--font-khmer);
    }

    .en-font,
    [lang="en"],
    input[type="email"],
    input[type="tel"],
    input[type="date"] {
      font-family: var(--font-english);
    }

    body {
      background-color: var(--bg-page);
      color: var(--text-main);
      min-height: 100vh;
      padding: 20px 14px 48px;
      overflow-x: hidden;
    }

    .reg-container {
      max-width: 780px;
      margin: 0 auto;
      background: #ffffff;
      border-radius: 20px;
      border: 1px solid var(--border);
      box-shadow: 0 16px 40px rgba(6, 57, 64, 0.08);
      padding: 26px 24px 32px;
    }

    .reg-header {
      text-align: center;
      margin-bottom: 22px;
    }

    .reg-header h1 {
      font-size: 24px;
      font-weight: 700;
      color: var(--teal-dark);
      margin-bottom: 6px;
    }

    .reg-header p {
      font-size: 13px;
      color: var(--text-muted);
    }

    .photo-upload-box {
      display: flex;
      align-items: center;
      gap: 16px;
      flex-wrap: wrap;
      background: #f8fafc;
      border: 1.5px dashed #cbd5e1;
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 20px;
    }

    .photo-square-preview {
      position: relative;
      width: 78px;
      height: 78px;
      border-radius: 16px;
      background: var(--teal-dark);
      color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 700;
      overflow: hidden;
      flex-shrink: 0;
    }

    .photo-square-preview img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
    }

    .choose-file-btn {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: #ecfdf5;
      color: #047857;
      border: 1px solid #a7f3d0;
      padding: 8px 14px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    @media (max-width: 600px) {
      .reg-container {
        padding: 20px 16px 26px;
      }
      .form-grid {
        grid-template-columns: 1fr;
      }
    }

    .field-group {
      margin-bottom: 2px;
    }

    label {
      display: block;
      font-size: 13.5px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 7px;
    }

    .req-star {
      color: #dc2626;
    }

    input,
    select {
      width: 100%;
      padding: 11px 13px;
      border: 1.5px solid #cbd5e1;
      border-radius: 12px;
      font-size: 14px;
      background: #ffffff;
      color: #0f172a;
    }

    input::placeholder {
      color: #94a3b8;
    }

    input:focus,
    select:focus {
      outline: none;
      border-color: var(--teal-bright);
    }

    /* Compact Payment Box with Click-Only Color & Animation */
    @keyframes popColor {
      0% {
        transform: scale(0.95);
      }
      60% {
        transform: scale(1.03);
      }
      100% {
        transform: scale(1);
      }
    }

    .payment-toggle-box {
      grid-column: 1 / -1;
      background: #f8fafc;
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 10px 14px;
    }

    .payment-btn-group {
      display: inline-flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .pay-choice-btn {
      width: auto;
      min-width: 124px;
      padding: 7px 14px;
      border-radius: 9px;
      border: 1.5px solid #cbd5e1;
      background: #ffffff;
      color: #64748b;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: background-color 0.22s ease, color 0.22s ease, border-color 0.22s ease, box-shadow 0.22s ease;
    }

    .pay-choice-btn:hover {
      border-color: #94a3b8;
      color: #334155;
    }

    .pay-choice-btn.active-unpaid {
      background: #fef3c7;
      color: #92400e;
      border-color: #f59e0b;
      box-shadow: 0 4px 12px rgba(245, 158, 11, 0.22);
      animation: popColor 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .pay-choice-btn.active-paid {
      background: #dcfce7;
      color: #15803d;
      border-color: #10b981;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.22);
      animation: popColor 0.28s cubic-bezier(0.22, 1, 0.36, 1);
    }

    .submit-row {
      margin-top: 22px;
    }

    .submit-btn {
      width: 100%;
      padding: 13px 18px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--teal-mid), var(--accent-green));
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    .submit-btn:disabled {
      opacity: 0.65;
      cursor: not-allowed;
    }

    .status-msg {
      margin-top: 14px;
      font-size: 13.5px;
      font-weight: 700;
      text-align: center;
      min-height: 22px;
    }
  </style>
</head>
<body>
  <div class="reg-container">
    <div class="reg-header">
      <h1>ចុះឈ្មោះចូលរៀន ឆ្នាំសិក្សា ថ្មី</h1>
      <p>វិទ្យាស្ថានជាតិបណ្តុះបណ្តាលបច្ចេកទេស (<span class="en-font">National Technical Training Institute</span>)</p>
    </div>

    <form id="registerForm">
      <div class="photo-upload-box">
        <div class="photo-square-preview en-font" id="photoBox">
          <span id="photoPlaceholder">Photo</span>
          <img id="photoPreviewImg" alt="Student Photo" />
        </div>
        <div style="flex:1;min-width:200px;">
          <div style="font-size:14px;font-weight:700;margin-bottom:4px;">រូបថតផ្ទាល់ខ្លួនសិស្ស (<span class="en-font">Student Photo</span>)</div>
          <div style="font-size:12px;color:#64748b;margin-bottom:10px;">
            ជ្រើសរើសរូបភាពពីទូរសព្ទ ឬកុំព្យូទ័រ (<span class="en-font">JPG, PNG</span>) 
          </div>
          <div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;">
            <label for="studentPhotoInput" class="choose-file-btn" style="margin:0;">ជ្រើសរើសរូបភាព (<span class="en-font">Choose File</span>)</label>
            <span class="en-font" id="fileChosenLabel" style="font-size:12.5px;color:#64748b;">No file chosen</span>
          </div>
          <input type="file" id="studentPhotoInput" accept="image/*" hidden />
        </div>
      </div>

      <div class="form-grid">
        <div class="field-group">
          <label for="nameKh">ឈ្មោះជាភាសាខ្មែរ</label>
          <input type="text" id="nameKh" placeholder="បញ្ចូលឈ្មោះភាសាខ្មែរ" required />
        </div>

        <div class="field-group">
          <label for="nameEn">ឈ្មោះជាអក្សរឡាតាំង (<span class="en-font">English</span>) <span class="req-star"></span></label>
          <input type="text" id="nameEn" class="en-font" placeholder="បញ្ចូលឈ្មោះជាអក្សរឡាតាំង" required />
        </div>

        <div class="field-group">
          <label for="gender">ភេទ (<span class="en-font">Gender</span>)</label>
          <select id="gender" required>
            <option value=""></option>
            <option value="ប្រុស">ប្រុស (<span class="en-font">Male</span>)</option>
            <option value="ស្រី">ស្រី (<span class="en-font">Female</span>)</option>
          </select>
        </div>

        <div class="field-group">
          <label for="phone">លេខទូរសព្ទផ្ទាល់ខ្លួន</label>
          <input type="tel" id="phone" placeholder="0998877002" required />
        </div>

        <div class="field-group">
          <label for="email">អ៊ីមែល (<span class="en-font">Email</span>)</label>
          <input type="email" id="email" placeholder="student@gmail.com" />
        </div>

        <div class="field-group">
          <label for="major">ជំនាញបច្ចេកទេស</label>
          <select id="major" required>
            <option value=""></option>
            <option value="បច្ចេកវិទ្យាព័ត៌មាន (IT)">បច្ចេកវិទ្យាព័ត៌មាន (<span class="en-font">IT</span>)</option>
            <option value="ព័ត៌មានវិទ្យា (IT)">ព័ត៌មានវិទ្យា (<span class="en-font">IT</span>)</option>
            <option value="អគ្គិសនី">អគ្គិសនី</option>
            <option value="អេឡិចត្រូនិក">អេឡិចត្រូនិក</option>
            <option value="មេកានិក">មេកានិក</option>
            <option value="សំណង់ស៊ីវិល">សំណង់ស៊ីវិល</option>
          </select>
        </div>

        <div class="field-group">
          <label for="level">កម្រិតសិក្សា</label>
          <select id="level" required>
            <option value=""></option>
            <option value="ឆ្នាំទី១">ឆ្នាំទី១</option>
            <option value="ឆ្នាំទី២">ឆ្នាំទី២</option>
            <option value="ឆ្នាំទី៣">ឆ្នាំទី៣</option>
            <option value="ឆ្នាំទី៤">ឆ្នាំទី៤</option>
            <option value="បរិញ្ញាបត្ររង">បរិញ្ញាបត្ររង</option>
          </select>
        </div>

        <div class="field-group">
          <label for="birthPlace">ទីកន្លែងកំណើត</label>
          <input type="text" id="birthPlace" placeholder="ខេត្ត / ក្រុង / ស្រុកកំណើត / ឃុំ / ភូមិ" required />
        </div>

        <div class="field-group" style="grid-column: 1 / -1;">
          <label for="dob">ថ្ងៃខែឆ្នាំកំណើត (<span class="en-font">Date of Birth</span>) <span class="req-star">*</span></label>
          <input type="date" id="dob" required />
        </div>

        <div class="payment-toggle-box">
          <label style="margin-bottom:4px;">ស្ថានភាពបង់ប្រាក់</label>
          <input type="hidden" id="paymentStatusInput" value="" />
          <div class="payment-btn-group">
            <button type="button" class="pay-choice-btn" id="btnUnpaid" data-val="មិនទាន់បង់">
              មិនទាន់បង់
            </button>
            <button type="button" class="pay-choice-btn" id="btnPaid" data-val="បានបង់ប្រាក់រួច">
              បានបង់ប្រាក់រួច
            </button>
          </div>
        </div>
      </div>

      <div class="submit-row">
        <button type="submit" class="submit-btn" id="submitBtn">បញ្ជូនពាក្យចុះឈ្មោះ (<span class="en-font">Submit</span>)</button>
      </div>

      <div class="status-msg" id="statusMsg"></div>
    </form>
  </div>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyC3hCrIMc5mvh4M0df7F-nQNvD_uynq1JY",
      authDomain: "nan-project-6fcea.firebaseapp.com",
      projectId: "nan-project-6fcea",
      storageBucket: "nan-project-6fcea.firebasestorage.app",
      messagingSenderId: "776441851200",
      appId: "1:776441851200:web:402f7bddb2e811c1019ea5",
      measurementId: "G-ZB9P8WCDNZ"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    const photoInput = document.getElementById("studentPhotoInput");
    const photoPreviewImg = document.getElementById("photoPreviewImg");
    const photoPlaceholder = document.getElementById("photoPlaceholder");
    const fileChosenLabel = document.getElementById("fileChosenLabel");
    const registerForm = document.getElementById("registerForm");
    const submitBtn = document.getElementById("submitBtn");
    const statusMsg = document.getElementById("statusMsg");

    const paymentStatusInput = document.getElementById("paymentStatusInput");
    const btnUnpaid = document.getElementById("btnUnpaid");
    const btnPaid = document.getElementById("btnPaid");

    let compressedPhotoDataUrl = "";

    function clearPaymentChoice() {
      paymentStatusInput.value = "";
      btnUnpaid.classList.remove("active-unpaid");
      btnPaid.classList.remove("active-paid");
    }

    function setPaymentChoice(val) {
      clearPaymentChoice();
      paymentStatusInput.value = val;
      if (val === "បានបង់ប្រាក់រួច") {
        void btnPaid.offsetWidth;
        btnPaid.classList.add("active-paid");
      } else if (val === "មិនទាន់បង់") {
        void btnUnpaid.offsetWidth;
        btnUnpaid.classList.add("active-unpaid");
      }
    }

    btnUnpaid.addEventListener("click", () => setPaymentChoice("មិនទាន់បង់"));
    btnPaid.addEventListener("click", () => setPaymentChoice("បានបង់ប្រាក់រួច"));

    function compressPhoto(file, maxDim = 320, quality = 0.65) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const img = new Image();
          img.onload = () => {
            let w = img.width;
            let h = img.height;
            if (w > h && w > maxDim) {
              h = Math.round((h * maxDim) / w);
              w = maxDim;
            } else if (h >= w && h > maxDim) {
              w = Math.round((w * maxDim) / h);
              h = maxDim;
            }
            const canvas = document.createElement("canvas");
            canvas.width = Math.max(1, w);
            canvas.height = Math.max(1, h);
            const ctx = canvas.getContext("2d");
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
            resolve(canvas.toDataURL("image/jpeg", quality));
          };
          img.onerror = reject;
          img.src = reader.result;
        };
        reader.onerror = reject;
        reader.readAsDataURL(file);
      });
    }

    photoInput.addEventListener("change", async (e) => {
      const file = e.target.files?.[0];
      if (!file) return;
      fileChosenLabel.textContent = file.name;
      statusMsg.style.color = "#0b5c61";
      statusMsg.textContent = "កំពុងរៀបចំរូបភាពឱ្យស្រាល...";
      try {
        compressedPhotoDataUrl = await compressPhoto(file, 320, 0.65);
        photoPreviewImg.src = compressedPhotoDataUrl;
        photoPreviewImg.style.display = "block";
        photoPlaceholder.style.display = "none";
        statusMsg.textContent = "";
      } catch (err) {
        console.error(err);
        statusMsg.style.color = "#dc2626";
        statusMsg.textContent = "មិនអាចបើករូបភាពនេះបានទេ សូមជ្រើសរើសរូបភាពផ្សេង។";
      }
    });

    registerForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      if (!paymentStatusInput.value) {
        statusMsg.style.color = "#dc2626";
        statusMsg.textContent = "សូមចុចជ្រើសរើសស្ថានភាពបង់ប្រាក់ជាមុនសិន!";
        return;
      }

      submitBtn.disabled = true;
      statusMsg.style.color = "#0b5c61";
      statusMsg.textContent = "កំពុងបញ្ជូនទិន្នន័យចុះឈ្មោះ...";

      const randomCode = "NTTI-2026-" + Math.floor(100000 + Math.random() * 899999);
      const chosenLevel = document.getElementById("level").value;

      const payload = {
        studentCode: randomCode,
        nameKh: document.getElementById("nameKh").value.trim(),
        nameEn: document.getElementById("nameEn").value.trim(),
        gender: document.getElementById("gender").value,
        phone: document.getElementById("phone").value.trim(),
        email: document.getElementById("email").value.trim().toLowerCase(),
        major: document.getElementById("major").value,
        level: chosenLevel,
        studyYear: chosenLevel,
        birthPlace: document.getElementById("birthPlace").value.trim(),
        dob: document.getElementById("dob").value,
        paymentStatus: paymentStatusInput.value,
        photoUrl: compressedPhotoDataUrl || "",
        createdAt: serverTimestamp()
      };

      try {
        await addDoc(collection(db, "students"), payload);
        statusMsg.style.color = "#15803d";
        statusMsg.innerHTML = `✅ ចុះឈ្មោះជោគជ័យ! លេខ <span class="en-font">${randomCode}</span>`;
        registerForm.reset();
        clearPaymentChoice();
        compressedPhotoDataUrl = "";
        photoPreviewImg.style.display = "none";
        photoPlaceholder.style.display = "block";
        fileChosenLabel.textContent = "No file chosen";
      } catch (err) {
        console.error(err);
        statusMsg.style.color = "#dc2626";
        statusMsg.textContent = "❌ បរាជ័យក្នុងការបញ្ជូន៖ " + err.message;
      } finally {
        submitBtn.disabled = false;
      }
    });
  </script>
</body>
</html>
